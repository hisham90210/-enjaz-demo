<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إنجاز | Enjaz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Palette inspired by the UAE federal Design System (DLS 2.0 — core "strength"
   palette: gold/black/red/green with neutral "Shades of White/Slate" backgrounds)
   deliberately shifted off the exact reserved core-palette hex values, since
   this product is an independent clearing office, not a federal entity — see
   the master brief's own trust principle (§67, §79) against implying government
   affiliation. Structure and mood (gold+ink+semantic red/green, flat, high
   contrast) is what we borrow; the literal government swatch is not reused. */
:root{
  --emerald:#8A6B2C; --emerald-dark:#6C5324; --emerald-tint:#F2EDDE;
  --navy:#1F2123; --navy-tint:#F1F1F2;
  --bg:#F7F7F7; --surface:#FFFFFF; --text:#1F2123; --muted:#6B6F76; --border:#E3E4E6;
  --success:#2F663C; --success-bg:#E4F4E7;
  --warning:#8A5A0B; --warning-bg:#FBF0DC;
  --error:#B52520; --error-bg:#FBE4E3;
  --info:#0073AB; --info-bg:#DEF3FF;
  --radius:14px; --radius-sm:9px;
  --shadow:0 4px 16px rgba(31,33,35,0.07);
  --font-ar:'Noto Kufi Arabic',sans-serif; --font-en:'Inter',sans-serif;
  --focus:0 0 0 3px rgba(138,107,44,.35);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#141414; --surface:#1C1C1D; --text:#F2F1ED; --muted:#A3A3A0;
    --border:#333332; --navy-tint:#232324; --emerald-tint:#2A2418;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1C1C1D; --text:#F2F1ED; --muted:#A3A3A0;
  --border:#333332; --navy-tint:#232324; --emerald-tint:#2A2418;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ar);}
body.lang-en{font-family:var(--font-en);}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, [tabindex]:focus-visible, a:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block;}
.icon-sm{width:16px;height:16px;}
.icon-lg{width:24px;height:24px;}

.app-shell{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
.top-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
.top-tabs button{padding:10px 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;min-height:40px;}
.top-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.lang-switch{position:fixed;top:16px;inset-inline-end:16px;display:flex;gap:6px;z-index:50;background:var(--surface);padding:5px;border-radius:999px;border:1px solid var(--border);box-shadow:var(--shadow);}
.lang-switch button{padding:6px 12px;border-radius:999px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--muted);min-height:32px;}
.lang-switch button.active{background:var(--emerald);color:#fff;}

.phone-wrap{display:flex;justify-content:center;padding:6px 0;}
.phone{width:375px;max-width:100%;background:var(--surface);border-radius:46px;border:7px solid #0A0A0B;box-shadow:0 20px 50px rgba(0,0,0,.22), inset 0 0 0 2px #2b2b2c;overflow:hidden;min-height:790px;display:flex;flex-direction:column;position:relative;}
.phone::before{content:"";position:absolute;top:88px;inset-inline-start:-9px;width:3px;height:60px;background:#0A0A0B;border-radius:2px;}
.phone::after{content:"";position:absolute;top:140px;inset-inline-end:-9px;width:3px;height:90px;background:#0A0A0B;border-radius:2px;}
.dynamic-island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#000;border-radius:16px;z-index:20;}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.screen-body{padding:16px 16px 8px;flex:1;}
.screen::-webkit-scrollbar{display:none;}
.home-indicator{height:20px;display:flex;align-items:center;justify-content:center;background:var(--surface);}
.home-indicator .bar{width:120px;height:4px;border-radius:99px;background:var(--navy);opacity:.55;}

.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.greeting{font-size:13px;color:var(--muted);}
.greeting b{color:var(--text);font-size:16px;display:flex;align-items:center;gap:6px;}
.avatar-row{display:flex;gap:8px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--emerald-tint);color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;border:none;position:relative;}
.dot{position:absolute;top:7px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;background:var(--error);border:1.5px solid var(--surface);}

.search-box{background:var(--navy-tint);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:9px;min-height:44px;}
.search-box input{border:none;background:transparent;outline:none;font-family:inherit;font-size:13.5px;color:var(--text);width:100%;}
.search-box input::placeholder{color:var(--muted);}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
.quick-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;font-size:11px;color:var(--text);min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.quick-item .qi-ic{width:34px;height:34px;border-radius:10px;background:var(--emerald-tint);color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;}

.section-title{font-size:15px;font-weight:700;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;}
.section-title .link{font-size:12px;color:var(--emerald);font-weight:600;display:inline-flex;align-items:center;gap:3px;}

.status-scroll{display:flex;gap:10px;overflow-x:auto;margin-bottom:22px;padding-bottom:4px;}
.status-chip{flex:0 0 auto;min-width:120px;border-radius:14px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:8px;}
.status-chip .top{display:flex;justify-content:space-between;align-items:center;}
.status-chip .num{font-size:22px;font-weight:800;}
.status-chip .lbl{font-size:11px;opacity:.92;}
.c1{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));}
.c2{background:linear-gradient(135deg,#C99A1E,#8f6a0c);}
.c3{background:linear-gradient(135deg,var(--navy),#061224);}
.c4{background:linear-gradient(135deg,#1F9D55,#146638);}

.chip-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.filter-chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);min-height:36px;}
.filter-chip.active{background:var(--emerald);color:#fff;border-color:var(--emerald);}

.service-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;min-height:44px;}
.service-card .ic{width:44px;height:44px;border-radius:12px;background:var(--emerald-tint);color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.service-card .body{flex:1;min-width:0;}
.service-card .title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.service-card .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.service-card .sub .meta{display:flex;align-items:center;gap:3px;}
.service-card .chev{color:var(--muted);flex:0 0 auto;}
.tag-featured{background:var(--warning-bg);color:var(--warning);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .ic{width:44px;height:44px;margin:0 auto 12px;color:var(--border);}
.empty-state .ic svg{width:100%;height:100%;}

.tx-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.tx-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.tx-ref{font-size:11px;color:var(--muted);}
.tx-title{font-size:14px;font-weight:700;margin-top:2px;}
.badge{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.b-review{background:var(--warning-bg);color:var(--warning);}
.b-pay{background:var(--error-bg);color:var(--error);}
.b-progress{background:var(--emerald-tint);color:var(--emerald-dark);}
.b-done{background:var(--success-bg);color:var(--success);}
.tx-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);}
.tx-foot .meta{display:flex;align-items:center;gap:4px;}

.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--surface);}
.bn-item{flex:1;padding:9px 4px 10px;text-align:center;border:none;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center;}
.bn-item.active{color:var(--emerald);}

.btn-primary{background:var(--emerald);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:14px;width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;}
.btn-primary:active{transform:scale(.98);}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--border);border-radius:12px;padding:13px;font-weight:700;font-size:13.5px;width:100%;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.back-row .bk{width:38px;height:38px;border-radius:10px;background:var(--navy-tint);border:none;display:flex;align-items:center;justify-content:center;color:var(--navy);}
.back-row h2{font-size:16px;margin:0;}

.detail-hero{background:var(--navy);border-radius:var(--radius);padding:18px;color:#fff;margin-bottom:18px;border:1px solid var(--navy);}
.detail-hero .r1{font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px;}
.detail-hero .r2{font-size:17px;font-weight:800;margin:6px 0 10px;}
.detail-hero .r3{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:6px;color:var(--emerald-tint);}
.fee-row{display:flex;justify-content:space-between;font-size:12.5px;padding:10px 0;border-bottom:1px dashed var(--border);}
.fee-row:last-child{border-bottom:none;font-weight:800;font-size:14px;}
.req-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-tint);border-radius:999px;padding:7px 12px;font-size:11.5px;margin:0 6px 8px 0;}

.timeline{margin:6px 0 20px;}
.t-step{display:flex;gap:12px;position:relative;padding-bottom:22px;}
.t-step:last-child{padding-bottom:0;}
.t-line{width:26px;display:flex;flex-direction:column;align-items:center;}
.t-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.t-dot.done{background:var(--success);color:#fff;}
.t-dot.now{background:var(--emerald);color:#fff;box-shadow:0 0 0 4px var(--emerald-tint);}
.t-dot.pending{background:var(--border);color:var(--muted);}
.t-body b{font-size:13px;display:block;}
.t-body span{font-size:11px;color:var(--muted);}
.t-bar{width:2px;flex:1;background:var(--border);margin-top:2px;}

.wizard-steps{display:flex;gap:4px;margin-bottom:18px;}
.wizard-steps .seg{flex:1;height:4px;border-radius:99px;background:var(--border);}
.wizard-steps .seg.on{background:var(--emerald);}
.form-field{margin-bottom:14px;}
.form-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600;}
.form-field input,.form-field select{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--border);background:var(--bg);font-family:inherit;font-size:13.5px;color:var(--text);min-height:44px;}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--emerald);box-shadow:var(--focus);}
.upload-box{border:1.5px dashed var(--border);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:8px;}

.doc-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:9px;min-height:44px;}
.doc-card .ic{width:38px;height:38px;border-radius:9px;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;}
.doc-card .meta b{font-size:12.5px;display:block;}
.doc-card .meta span{font-size:10.5px;color:var(--muted);}
.doc-card .stat{margin-inline-start:auto;font-size:10px;font-weight:700;padding:4px 9px;border-radius:99px;display:flex;align-items:center;gap:4px;}

.profile-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--border);font-size:13px;min-height:44px;}
.profile-row .l{display:flex;align-items:center;gap:11px;}
.profile-row .l .ic{color:var(--muted);}

/* ---------- Admin ---------- */
.admin-wrap{display:grid;grid-template-columns:220px 1fr;gap:0;background:var(--surface);border-radius:20px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);min-height:720px;}
.admin-side{background:var(--navy);color:#fff;padding:22px 14px;}
.admin-side .brand{font-weight:800;font-size:16px;margin-bottom:22px;padding:0 8px;display:flex;align-items:center;gap:8px;}
.admin-side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.75);font-size:13px;font-weight:600;margin-bottom:2px;text-decoration:none;cursor:pointer;min-height:40px;}
.admin-side a.active{background:rgba(255,255,255,.14);color:#fff;}
.admin-side a .badge-new{margin-inline-start:auto;background:var(--emerald);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;}
.admin-main{padding:26px 28px;}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.admin-head h1{font-size:19px;margin:0;display:flex;align-items:center;gap:10px;}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
.kpi-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.kpi-card .top{display:flex;justify-content:space-between;align-items:center;}
.kpi-card .icwrap{width:30px;height:30px;border-radius:8px;background:var(--emerald-tint);color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;}
.kpi-card .v{font-size:21px;font-weight:800;}
.kpi-card .l{font-size:11px;color:var(--muted);}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;}
.panel h3{margin:0 0 12px;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:11.5px;}
.bar-row .lab{width:90px;color:var(--muted);flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--emerald);border-radius:99px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:start;color:var(--muted);font-weight:600;font-size:11px;padding:9px 10px;border-bottom:1px solid var(--border);}
td{padding:11px 10px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.kan-col{background:var(--bg);border-radius:12px;padding:10px;min-height:340px;}
.kan-col h4{font-size:11.5px;margin:2px 4px 10px;color:var(--muted);display:flex;justify-content:space-between;}
.kan-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;font-size:11.5px;box-shadow:0 2px 6px rgba(0,0,0,.04);}
.kan-card b{display:block;font-size:12px;margin-bottom:4px;}
.kan-card .who{color:var(--muted);font-size:10.5px;margin-top:6px;display:flex;align-items:center;gap:4px;}

/* Experiments / A-B test */
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.ab-card{background:var(--bg);border:2px solid var(--border);border-radius:16px;padding:18px;position:relative;}
.ab-card.winner{border-color:var(--emerald);}
.ab-card .ab-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ab-card .ab-tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--navy);color:#fff;}
.ab-card.winner .ab-tag{background:var(--emerald);}
.ab-preview{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px;}
.ab-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ab-metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;}
.ab-metric .v{font-size:17px;font-weight:800;}
.ab-metric .l{font-size:10.5px;color:var(--muted);}
.ab-metric .delta{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:2px;margin-top:2px;}
.ab-metric .delta.up{color:var(--success);}
.win-banner{display:flex;align-items:center;gap:10px;background:var(--emerald-tint);color:var(--emerald-dark);border-radius:12px;padding:14px 16px;font-size:12.5px;margin-bottom:18px;}
.win-banner b{font-size:13.5px;}
.confidence-bar{height:10px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:10px;display:flex;}
.confidence-bar .a{background:var(--navy);}
.confidence-bar .b{background:var(--emerald);}
.apply-row{display:flex;gap:10px;margin-top:14px;}
.apply-row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;color:var(--text);min-height:40px;}
.apply-row button.on{background:var(--emerald);color:#fff;border-color:var(--emerald);}

/* ============== Flat, government-grade finish ==============
   The UAE federal Design System explicitly recommends Flat UI over gradients/
   shadows/3D effects for government-facing apps — it reads as clearer, more
   accessible, and more trustworthy. So: solid fills, thin borders, minimal
   elevation, and motion used only where it communicates state (loading,
   live status) rather than as decoration. */

/* duotone: soft flat fill behind a crisp stroke on every closed shape */
.icon circle,.icon rect{fill:currentColor;fill-opacity:.14;}

/* one restrained reveal per screen change — not per-card */
@keyframes riseIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.reveal{animation:riseIn .22s ease both;}

/* live-status pulse — the one deliberate motion accent for "in progress" */
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 3px var(--emerald-tint);}50%{box-shadow:0 0 0 6px var(--emerald-tint);}}
.t-dot.now{animation:pulseRing 2.2s ease-in-out infinite;}

/* tap feedback across every interactive surface */
.service-card,.tx-card,.doc-card,.quick-item,.filter-chip,.profile-row,.icon-btn,.kan-card,.status-chip,.bn-item,.top-tabs button,.admin-side a{
  transition:transform .1s ease, background-color .15s ease, border-color .15s ease;
}
.service-card:active,.tx-card:active,.doc-card:active,.quick-item:active,.filter-chip:active,.icon-btn:active,.status-chip:active{transform:scale(.97);}
.admin-main .kan-card:hover{background:var(--navy-tint);}
.admin-main tr:hover td{background:var(--navy-tint);}
.admin-side a:hover{background:rgba(255,255,255,.08);}

/* bottom-nav: icon lifts into a flat filled pill when active — no shadow */
.bn-item .ic-wrap{width:36px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:9px;transition:background .2s ease, transform .2s ease;}
.bn-item.active .ic-wrap{background:var(--emerald-tint);transform:translateY(-2px);}
.bn-item span:last-child{transition:transform .2s ease;}

.qi-ic{background:var(--emerald-tint);}
.kpi-card .icwrap{background:var(--emerald-tint);}

/* status bar + title bar — official pattern: back/title/notif/avatar stays in
   the same physical order regardless of language (only text alignment flips) */
.statusbar{height:30px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;font-size:12px;font-weight:600;font-family:var(--font-en);}
.statusbar .sb-icons{display:flex;align-items:center;gap:5px;}
.titlebar{direction:ltr;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.titlebar .tb-back,.titlebar .tb-icon,.titlebar .tb-avatar{width:34px;height:34px;border-radius:9px;border:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--navy-tint);color:var(--navy);position:relative;}
.titlebar .tb-avatar{background:var(--emerald-tint);color:var(--emerald-dark);font-weight:800;font-size:13px;font-family:var(--font-en);}
.titlebar .tb-spacer{width:34px;flex:0 0 auto;}
.titlebar .tb-title{flex:1;min-width:0;font-size:15px;font-weight:700;direction:auto;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.titlebar .tb-title.tb-greet{font-size:12.5px;font-weight:400;color:var(--muted);}
.titlebar .tb-title.tb-greet b{display:block;font-size:16px;font-weight:800;color:var(--text);margin-top:1px;}

@media (max-width:920px){
  .admin-wrap{grid-template-columns:1fr;}
  .admin-side{display:flex;gap:6px;overflow-x:auto;padding:12px;}

  .two-col,.ab-grid{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr 1fr;overflow-x:auto;}
}

function statusBar(){
  return `<div class="statusbar"><span>9:41</span><span class="sb-icons">${I('signal','icon-sm')}${I('wifi','icon-sm')}${I('battery','icon-sm')}</span></div>`;
}
/* Official gov app title-bar pattern: back / title / notifications / avatar
   stay in the same physical slot in both languages — only text alignment
   and reading direction change. See docs/05-gov-design-reference.md. */
function titleBar(title, showBack, isHome){
  const back = showBack
    ? `<button class="tb-back" onclick="goBack()">${I(lang==='ar'?'chevronStart':'chevronEnd','icon-sm')}</button>`
    : `<div class="tb-spacer"></div>`;
  const notif = `<button class="tb-icon" onclick="goScreen('notif')">${I('bell','icon-sm')}<span class="dot"></span></button>`;
  const avatar = `<button class="tb-avatar">${lang==='ar'?'ه':'H'}</button>`;
  const titleEl = isHome
    ? `<div class="tb-title tb-greet" style="text-align:${lang==='ar'?'right':'left'}">${tr('hello')}<b>${tr('name')}</b></div>`
    : `<div class="tb-title" style="text-align:${lang==='ar'?'right':'left'}">${title}</div>`;
  return `<div class="titlebar">${back}${titleEl}${notif}${avatar}</div>`;
}

function renderCustomer(){
  const root=document.getElementById('screen-root');
  let body='';
  if(custScreen==='home') body = screenHome();
  else if(custScreen==='services') body = screenServices();
  else if(custScreen==='serviceDetail') body = screenServiceDetail();
  else if(custScreen==='wizard') body = screenWizard();
  else if(custScreen==='requests') body = screenRequests();
  else if(custScreen==='requestDetail') body = screenRequestDetail();
  else if(custScreen==='wallet') body = screenWallet();
  else if(custScreen==='profile') body = screenProfile();
  else if(custScreen==='notif') body = screenNotif();
  const meta = SCREEN_META[custScreen] || {};
  const title = typeof meta.title==='function' ? meta.title() : (meta.title||'');
  root.innerHTML = `<div class="reveal" style="display:flex;flex-direction:column;min-height:100%;">
    ${statusBar()}
    ${titleBar(title, !!meta.back, !!meta.home)}
    <div class="screen-body">${body}</div>

}

function svcCardPreview(variant,s){
  const name = svcName(s.id);
  if(variant==='B'){
    const total = s.feeGov+s.feeOff;
    return `<div class="service-card" style="align-items:stretch;margin:0;">
      <div class="ic" style="width:52px;height:52px;">${I(s.icon,'icon-lg')}</div>
      <div class="body">
        <div class="title">${name}<span class="tag-featured">${tr('featured_lbl')}</span></div>
        <div class="sub"><span class="meta">${I('clock','icon-sm')} ${s.days} ${tr('days_lbl')}</span></div>
        <div style="font-weight:800;font-size:14px;color:var(--emerald-dark);margin-top:6px;">${fmtMoney(total)} ${currency()}</div>
      </div>
      <div class="chev">${chev()}</div>
    </div>`;
  }
  return `<div class="service-card" style="margin:0;">
    <div class="ic">${I(s.icon)}</div>
    <div class="body">
      <div class="title">${name}<span class="tag-featured">${tr('featured_lbl')}</span></div>
      <div class="sub"><span class="meta">${I('clock','icon-sm')} ${s.days} ${tr('days_lbl')}</span><span class="meta">${I('grid','icon-sm')} ${tr('cat_'+s.cat)}</span></div>
    </div>
    <div class="chev">${chev()}</div>
  </div>`;
}

renderStatic(); renderCustomer(); renderAdmin();
